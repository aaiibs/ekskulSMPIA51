<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presensi Ekskul — SMPI Al Azhar 51 IIBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Spectral:wght@500;600;700&display=swap">
<style>
/* Layout: navy masthead + left rail (desktop) / bottom tab bar (phone); content in a 1140px measure of stacked cards. */
:root{
  --brand:#1281C6; --brand-ink:#0B5C92; --brand-deep:#08456E; --brand-wash:#E8F3FB; --brand-line:#BFDCF0;
  --ink:#1F2933; --gold:#C08A2E;
  --bg:#F4F8FC; --surface:#FFFFFF; --surface-2:#EDF4FA;
  --fg:#14202B; --fg-muted:#5A7186; --line:#D7E5F1;
  --ok:#157A58; --ok-bg:#E1F3EC;
  --izin:#9A6B10; --izin-bg:#FBF1DC;
  --sakit:#1F6AA8; --sakit-bg:#E3EFF9;
  --alpha:#B5362A; --alpha-bg:#FAE7E4;
  --shadow:0 1px 2px rgba(15,60,100,.06),0 10px 26px -18px rgba(15,60,100,.35);
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* masthead */
.mast{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(18,129,198,.06)}
.mast::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-ink) 55%,var(--gold) 100%)}
.mast-in{max-width:1140px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:14px}
.crest{width:44px;height:44px;flex:none;border-radius:50%}
.mast h1{font-size:17px;letter-spacing:.2px;color:var(--brand-deep);line-height:1.2}
.mast p{margin:2px 0 0;font-size:11.5px;color:var(--fg-muted);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.mast .ta{margin-left:auto;font-size:12px;color:var(--fg-muted);text-align:right;font-variant-numeric:tabular-nums}

.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:20px 96px;display:grid;gap:20px}
@media (min-width:900px){.wrap{grid-template-columns:212px minmax(0,1fr);align-items:start;padding-block:24px 40px}}

/* nav */
nav.rail{display:none}
@media (min-width:900px){
  nav.rail{display:block;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
  nav.rail button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--fg-muted);font-weight:600;font-size:14px}
  nav.rail button:hover{background:var(--surface-2);color:var(--fg)}
  nav.rail button[aria-current="true"]{background:var(--brand-wash);color:var(--brand-deep)}
  nav.rail button[aria-current="true"] svg{color:var(--brand)}
}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){nav.tabs{display:none}}
nav.tabs button{flex:1;background:none;border:0;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--fg-muted);font-size:11px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--brand-deep);background:var(--brand-wash)}
nav svg{width:18px;height:18px;flex:none}

main{display:grid;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card-h h2{font-size:17px;color:var(--brand-deep)}
.card-h .sub{font-size:12.5px;color:var(--fg-muted)}
.card-b{padding:16px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);font-weight:700}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .n{font-family:var(--display);color:var(--brand-deep);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .l{font-size:12px;color:var(--fg-muted);margin-top:4px}
.kpi.accent{border-left:3px solid var(--brand)}

/* bars */
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.bar-row .nm{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .h{background:var(--ok)} .track .i{background:var(--izin)} .track .s{background:var(--sakit)} .track .a{background:var(--alpha)}
.bar-row .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--fg-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* chips & controls */
.row{display:flex;flex-wrap:wrap;gap:8px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted)}
select,input[type="text"],input[type="date"],input[type="search"],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.btn{background:var(--brand-ink);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--brand-deep)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.gold{background:var(--brand);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.p-hadir{background:var(--ok-bg);color:var(--ok)} .p-izin{background:var(--izin-bg);color:var(--izin)}
.p-sakit{background:var(--sakit-bg);color:var(--sakit)} .p-alpha{background:var(--alpha-bg);color:var(--alpha)}
.p-kosong{background:var(--surface-2);color:var(--fg-muted)}
.p-prog{background:var(--surface-2);color:var(--fg-muted);font-weight:600}

/* attendance list */
.mlist{display:grid;gap:0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .who{min-width:0}
.mrow .who b{font-weight:600;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .who small{color:var(--fg-muted);font-size:12px}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px}
.seg button{width:34px;height:30px;border:0;border-radius:7px;background:transparent;font-weight:800;font-size:13px;color:var(--fg-muted);cursor:pointer}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{color:#fff}
.seg button.h[aria-pressed="true"]{background:var(--ok)} .seg button.i[aria-pressed="true"]{background:var(--izin)}
.seg button.s[aria-pressed="true"]{background:var(--sakit)} .seg button.a[aria-pressed="true"]{background:var(--alpha)}
.adacatatan{color:var(--brand-ink);font-weight:600}
.catatan-blok{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.catatan-blok .eyebrow{margin:0 0 10px}
.catatan-form{display:grid;gap:12px;grid-template-columns:minmax(180px,230px) minmax(0,1fr) auto;align-items:start}
.catatan-form textarea{min-height:58px}
.catatan-form .btn{white-space:nowrap}
@media (max-width:700px){.catatan-form{grid-template-columns:1fr}
  .catatan-form .btn{width:100%}}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
td .nmcell{white-space:normal;min-width:170px;display:block}

.empty{padding:28px 16px;text-align:center;color:var(--fg-muted);font-size:13.5px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:16px;margin-bottom:5px}
.note{font-size:12.5px;color:var(--fg-muted)}
.hint{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--fg-muted)}
.sessbar{display:grid;gap:12px}
.ssum{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flag{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:9px;background:var(--alpha-bg);color:var(--alpha);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--brand-deep);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:24px}}
.syncbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));
  z-index:50;background:var(--surface);border:1px solid var(--line);color:var(--fg-muted);
  padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.syncbar.kerja{color:var(--brand-ink);border-color:var(--brand-line);background:var(--brand-wash)}
.syncbar.baik{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.syncbar.buruk{color:var(--alpha);border-color:var(--alpha);background:var(--alpha-bg)}
.btn.bahaya{color:var(--alpha);border-color:var(--alpha-bg)}
.btn.bahaya:hover{background:var(--alpha-bg);border-color:var(--alpha)}
.btn.bahaya-isi{background:var(--alpha);color:#fff}
.btn.bahaya-isi:hover{background:#8E2A20}
.konfirm{border:1px solid var(--alpha);background:var(--alpha-bg);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.konfirm b{font-family:var(--display);font-size:15.5px;color:var(--alpha)}
.konfirm p{margin:0;font-size:13px;color:var(--fg)}
.konfirm .peringatan{font-weight:600;color:var(--alpha)}
/* --- halaman masuk --- */
body.mode-masuk .wrap{grid-template-columns:minmax(0,1fr)}
body.mode-masuk nav.tabs{display:none}
.masuk{display:grid;gap:22px;max-width:760px;margin:12px auto 0}
.masuk-kop{text-align:center}
.masuk-kop h2{font-size:28px;color:var(--brand-deep)}
.masuk-kop p{margin:8px 0 0;color:var(--fg-muted);font-size:14px}
.masuk-pilih{display:grid;gap:14px}
@media (min-width:720px){.masuk-pilih{grid-template-columns:1fr 1fr}}
.kartu-peran{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;cursor:pointer;display:grid;gap:7px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.kartu-peran:hover{border-color:var(--brand);transform:translateY(-2px)}
.kartu-peran .lencana{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--brand)}
.kartu-peran b{font-family:var(--display);font-size:19px;color:var(--brand-deep)}
.kartu-peran small{color:var(--fg-muted);font-size:13px;line-height:1.55}
.masuk-kotak{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  box-shadow:var(--shadow);display:grid;gap:14px;max-width:440px;margin:0 auto;width:100%}
.masuk-kotak h2{font-size:21px;color:var(--brand-deep)}
.masuk-kotak .note{margin:-6px 0 0}
.masuk-salah{margin:0;font-size:13px;font-weight:600;color:var(--alpha);background:var(--alpha-bg);
  padding:9px 12px;border-radius:9px}
nav.rail button.keluar,nav.tabs button.keluar{color:var(--fg-muted)}
nav.rail button.keluar{margin-top:6px;border-top:1px solid var(--line);border-radius:0 0 8px 8px}

/* --- foto --- */
.foto-aksi{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foto-aksi .note{margin-left:4px}
.foto-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-top:14px}
.foto-grid.besar{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.foto{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2)}
.foto figcaption{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 9px;
  font-size:11.5px;color:var(--fg-muted);min-height:30px}
.foto figcaption b{display:block;color:var(--fg);font-size:12.5px;font-weight:600}
.foto figcaption span{display:block}
.foto-hapus{flex:none;border:0;background:transparent;color:var(--alpha);font-size:17px;line-height:1;
  cursor:pointer;padding:2px 5px;border-radius:6px}
.foto-hapus:hover{background:var(--alpha-bg)}

/* --- selesai & terima kasih --- */
.selesai-blok{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.selesai-blok b{font-family:var(--display);font-size:16px;color:var(--brand-deep)}
.selesai-blok .note{margin:3px 0 0;max-width:46ch}
.selesai-blok .btn{margin-left:auto}
.btn.besar{padding:12px 22px;font-size:15px}
.terima{text-align:center;padding:34px 20px;display:grid;gap:14px;justify-items:center}
.terima-ikon{color:var(--ok);width:68px;height:68px}
.terima-ikon svg{width:100%;height:100%}
.terima h2{font-size:30px;color:var(--brand-deep)}
.terima-ayat{margin:0;font-size:15px;color:var(--ok);font-weight:600}
.terima-sub{margin:0;font-size:14px;color:var(--fg-muted);line-height:1.6}
.terima-angka{display:grid;grid-template-columns:repeat(4,minmax(62px,88px));gap:10px;margin-top:4px}
.terima-angka div{background:var(--surface-2);border-radius:10px;padding:11px 6px}
.terima-angka b{display:block;font-family:var(--display);font-size:23px;color:var(--brand-deep)}
.terima-angka span{font-size:11.5px;color:var(--fg-muted)}
.terima-catatan{margin:0;font-size:12.5px;color:var(--fg-muted);max-width:52ch}
.srch{position:relative}
.people{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.person{text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer}
.person:hover{border-color:var(--brand)}
.person b{display:block;font-size:13.5px;font-weight:600}
.person small{color:var(--fg-muted);font-size:12px}
.bk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--fg-muted);font-weight:700;font-size:13px;cursor:pointer;padding:0}
.bk:hover{color:var(--fg)}
.histrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.histrow:first-child{border-top:0}
.histrow small{color:var(--fg-muted);display:block;font-size:12px}
</style>

</head>
